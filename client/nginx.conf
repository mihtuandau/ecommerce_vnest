# nginx.conf for React SPA deployment
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy - ẩn backend URL
    location /api/ {
        # Option 1: Dùng tên service Docker (nếu cùng network) - TỐT NHẤT
        proxy_pass http://ecommerce_server:5000/;
        # Option 2: Dùng localhost (nếu cùng máy VPS)
        # proxy_pass http://localhost:5000/;
        # Option 3: Dùng IP VPS (nếu cần)
        # proxy_pass http://223.130.11.30:5000/;
        
        # CRITICAL: Secret header to verify nginx proxy requests
        # Value is injected from PROXY_SECRET env variable at container startup
        proxy_set_header X-Proxy-Secret "${PROXY_SECRET}";
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
